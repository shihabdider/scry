<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scry</title>
    <link rel="stylesheet" href="src/panel/styles.css" />
  </head>
  <body>
    <main class="scry" aria-label="Scry history search">
      <header class="scry-header">
        <div class="brand-line">
          <h1>Scry</h1>
          <span id="status" class="status" role="status">Loading history…</span>
        </div>
        <div id="search-header" class="search-header" aria-label="Search recent history; No results">
          <span id="search-header-before" class="search-header-text">Search</span>
          <button id="mode-indicator" class="mode-indicator" type="button" data-mode="recent" data-status="idle" data-clickable="true" aria-label="[recent]; Recent history not loaded" title="Recent history not loaded">[recent]</button>
          <span id="search-header-after" class="search-header-text">history</span>
          <span id="mode-switch-hint" class="mode-switch-hint" aria-hidden="true">Tab/Shift+Tab</span>
          <span id="result-count" class="result-count" aria-live="polite" aria-label="No results">No results</span>
        </div>
        <input id="search-input" class="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="git skilift issues 13 — i or / to search" aria-label="Search recent history" autofocus />
      </header>

      <section id="message" class="message" hidden></section>
      <ol id="results" class="results" aria-label="History results" tabindex="-1"></ol>

      <nav id="pagination" class="pagination" aria-label="Result pages" hidden>
        <button id="previous-page-button" class="page-button" type="button">h previous</button>
        <span id="page-status" class="page-status">Page 1 of 1</span>
        <button id="next-page-button" class="page-button" type="button">l next</button>
      </nav>

      <section class="deep-search" hidden aria-hidden="true">
        <button id="deep-search-button" class="deep-search-button" type="button" hidden aria-hidden="true" tabindex="-1">Deep search all history</button>
      </section>

    </main>
    <script type="module" src="src/panel/main.js"></script>
  </body>
</html>
